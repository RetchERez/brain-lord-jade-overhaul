name: Bug report
description: Report a reproducible issue with Vanilla Plus Fairies
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Include the area and both equipped fairies; please do not attach ROM files
  - type: input
    id: version
    attributes:
      label: Patch version
      placeholder: Version 1.0 / v10
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: Emulator or hardware and version
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Game setup
      description: Clean USA ROM, new game or imported save, area, both fairies and their levels
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected behavior and actual behavior
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or clips
