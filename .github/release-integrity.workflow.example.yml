# Optional: place this file under .github/workflows when workflow access is enabled
name: Release integrity

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify patch, player archive and media
        run: python3 .github/scripts/verify_release.py
